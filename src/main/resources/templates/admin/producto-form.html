<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head('Producto')}"></head>
<body class="admin">
<div class="admin-shell">
    <aside th:replace="~{admin/fragments/lado :: lado}"></aside>
    <div class="admin-cuerpo">
        <header th:replace="~{admin/fragments/lado :: tope}"></header>
        <main class="admin-main">
            <div th:replace="~{fragments/avisos :: avisos}"></div>
            <div class="admin-encabezado">
                <div>
                    <p class="kicker">Catálogo</p>
                    <h1 th:text="${formulario.id == null} ? 'Nuevo producto' : 'Editar producto'">Producto</h1>
                </div>
                <a class="btn-linea" th:href="@{/admin/productos}">Volver</a>
            </div>
            <form class="panel" th:action="@{/admin/productos}" th:object="${formulario}" method="post" novalidate>
                <input type="hidden" th:field="*{id}">
                <div class="form-grid">
                    <label class="campo">
                        <span>Nombre</span>
                        <input type="text" th:field="*{nombre}">
                        <small class="campo-error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></small>
                    </label>
                    <label class="campo">
                        <span>SKU</span>
                        <input type="text" th:field="*{sku}" placeholder="NT-LIB-001">
                        <small class="campo-error" th:if="${#fields.hasErrors('sku')}" th:errors="*{sku}"></small>
                    </label>
                    <label class="campo campo-ancho">
                        <span>Resumen</span>
                        <input type="text" th:field="*{resumen}">
                        <small class="campo-error" th:if="${#fields.hasErrors('resumen')}" th:errors="*{resumen}"></small>
                    </label>
                    <label class="campo campo-ancho">
                        <span>Descripción</span>
                        <textarea th:field="*{descripcion}"></textarea>
                        <small class="campo-error" th:if="${#fields.hasErrors('descripcion')}" th:errors="*{descripcion}"></small>
                    </label>
                    <label class="campo">
                        <span>Precio de venta (USD)</span>
                        <input type="number" step="0.01" min="0" th:field="*{precio}">
                        <small class="campo-error" th:if="${#fields.hasErrors('precio')}" th:errors="*{precio}"></small>
                    </label>
                    <label class="campo">
                        <span>Precio de lista (opcional)</span>
                        <input type="number" step="0.01" min="0" th:field="*{precioLista}">
                        <small class="campo-error" th:if="${#fields.hasErrors('precioLista')}" th:errors="*{precioLista}"></small>
                    </label>
                    <label class="campo">
                        <span>Stock</span>
                        <input type="number" min="0" th:field="*{stock}">
                        <small class="campo-error" th:if="${#fields.hasErrors('stock')}" th:errors="*{stock}"></small>
                    </label>
                    <label class="campo">
                        <span>Sección</span>
                        <select th:field="*{categoria}">
                            <option value="">Elegir</option>
                            <option th:each="seccion : ${secciones}" th:value="${seccion}" th:text="${seccion.nombre}"></option>
                        </select>
                        <small class="campo-error" th:if="${#fields.hasErrors('categoria')}" th:errors="*{categoria}"></small>
                    </label>
                    <div class="campo campo-ancho">
                        <span>Portada</span>
                        <div class="portadas">
                            <label class="portada-opcion" th:each="portada : ${portadas}">
                                <input type="radio" th:field="*{imagen}" th:value="${portada.id}">
                                <img th:src="@{|/img/portadas/${portada.id}.svg|}" alt="">
                                <span th:text="${portada.nombre}">Nombre</span>
                            </label>
                        </div>
                        <small class="campo-error" th:if="${#fields.hasErrors('imagen')}" th:errors="*{imagen}"></small>
                    </div>
                    <div class="checks campo-ancho">
                        <label class="check"><input type="checkbox" th:field="*{destacado}"> Mostrar en portada</label>
                        <label class="check"><input type="checkbox" th:field="*{activo}"> Visible en la tienda</label>
                    </div>
                </div>
                <div class="acciones">
                    <button class="btn" type="submit">Guardar producto</button>
                </div>
            </form>
        </main>
    </div>
</div>
</body>
</html>
