<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Pedido registrado')}"></head>
<body class="sitio">
<header th:replace="~{fragments/header :: header}"></header>
<main id="contenido" class="contenedor">
    <div class="pagina-titulo">
        <p class="kicker">Listo</p>
        <h1>Pedido registrado</h1>
    </div>
    <section class="comprobante">
        <div class="comprobante-tope">
            <div>
                <p class="kicker">Comprobante</p>
                <p th:text="${venta.numero}">NT-2026-00001</p>
            </div>
            <span class="estado" th:classappend="${venta.estado}" th:text="${venta.estado.etiqueta}">Estado</span>
        </div>
        <p th:text="${#temporals.format(venta.fecha, 'dd/MM/yyyy HH:mm')}">Fecha</p>
        <p th:text="${venta.clienteNombre}">Cliente</p>
        <p th:text="${venta.clienteEmail}">Correo</p>
        <p th:text="|${venta.direccion}, ${venta.ciudad}|">Dirección</p>
        <div class="tabla-wrap">
            <table class="data">
                <thead>
                <tr><th>Pieza</th><th>Cant.</th><th>Precio</th><th>Subtotal</th></tr>
                </thead>
                <tbody>
                <tr th:each="linea : ${venta.lineas}">
                    <td th:text="${linea.nombre}">Nombre</td>
                    <td th:text="${linea.cantidad}">1</td>
                    <td th:text="${@dinero.format(linea.precioUnitario)}">US$ 0</td>
                    <td th:text="${@dinero.format(linea.subtotal)}">US$ 0</td>
                </tr>
                </tbody>
            </table>
        </div>
        <p class="total-grande"><span>Total</span><span th:text="${@dinero.format(venta.total)}">US$ 0</span></p>
        <p class="nota">Medio declarado: <span th:text="${venta.metodoPago.etiqueta}">Efectivo</span>. No se realizó un cobro. Para imprimir este comprobante, usá la impresión del navegador.</p>
    </section>
    <div class="acciones no-print" style="margin: 1rem 0 2rem;">
        <a class="btn" th:href="@{/catalogo}">Seguir mirando</a>
    </div>
</main>
<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
