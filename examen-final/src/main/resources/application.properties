# Base PostgreSQL. En la computadora del examen, si el usuario o la clave
# son otros, cambiar solo estas tres lineas.
spring.datasource.url=jdbc:postgresql://localhost:5432/tienda_noticias
spring.datasource.username=postgres
spring.datasource.password=postgres

# Crea o actualiza la tabla productos al arrancar. No hace falta crearla a mano.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080
spring.application.name=tienda-noticias
